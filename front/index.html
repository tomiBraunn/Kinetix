<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetix</title>
    <!-- Preconnect + <link> en vez de @import en el CSS: @import se descubre
         recién cuando el navegador ya parseó index.css, así que la fuente
         arrancaba a pedirse tarde. Esto la pide en paralelo desde el arranque.
         Material Symbols (los íconos) se sirve local via npm en vez de Google
         Fonts — ver src/index.css — porque el CDN seguía fallando en la práctica. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,400;1,9..40,500;1,9..40,900&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
